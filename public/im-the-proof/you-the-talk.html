<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Black+Ops+One&family=Cormorant+Garamond:ital,wght@1,300&family=Permanent+Marker&family=Special+Elite&display=swap">
<title>You the Talk &mdash; Lyric Display</title>
<style>
/* ============ DATA-DRIVEN CSS ============
   Driven by the track data via CSS custom properties:
   --bpm      measured tempo (beats per minute)
   --beat     one beat in ms  (60000/--bpm)
   --key-hue  palette hue from the estimated key
   --nrg      0..1 vocal energy for the CURRENT SHOT (set per shot by JS)
   --wnrg     0..1 vocal energy for the CURRENT WORD (set per word in markup)
*/
:root{
  box-sizing:border-box;
  --bpm:86.13;
  --beat:calc(60000ms / var(--bpm));
  --key-hue:210;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{
  height:100%;margin:0;background:#0a0a0a;color:#eee;
  font-family:Impact,Arial,sans-serif;overflow:hidden;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
#stage{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 38%,hsl(var(--key-hue) 55% 9% / .55),transparent 70%),var(--bg,#0a0a0a);
  transition:background .25s;
  --bg:#0a0a0a;--fg:#eee;--glow:#000;--nrg:1;user-select:none;
}
/* ---- beat-reactive layers ---- */
#beatring{
  position:absolute;left:50%;top:50%;width:70vmin;height:70vmin;
  transform:translate(-50%,-50%) scale(.6);
  border:2px solid hsl(var(--key-hue) 80% 60%);border-radius:50%;
  opacity:0;pointer-events:none;
}
#beatring.go{animation:ring var(--beat) ease-out both;}
@keyframes ring{
  0%{opacity:.75;transform:translate(-50%,-50%) scale(.6);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.35);}
}
#beatring2{
  position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;
  transform:translate(-50%,-50%) scale(.7);
  border:1px solid hsl(var(--key-hue) 90% 70%);border-radius:50%;
  opacity:0;pointer-events:none;
}
#beatring2.go{animation:ring2 var(--beat) ease-out both;}
@keyframes ring2{
  0%{opacity:.6;transform:translate(-50%,-50%) scale(.7);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.2);}
}
#kickflash{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(100% 100% at 50% 50%,hsl(var(--key-hue) 95% 60% / .38),transparent 62%);
}
#kickflash.go{animation:kflash .3s ease-out both;}
@keyframes kflash{0%{opacity:1;}100%{opacity:0;}}
/* kick zoom: the whole lyric field punches in a hair on every kick */
#kickzoom{
  position:absolute;inset:0;pointer-events:none;opacity:0;z-index:1;
  background:radial-gradient(90% 90% at 50% 55%,transparent 55%,hsl(var(--key-hue) 90% 55% / .22) 100%);
}
#kickzoom.go{animation:kzoom .32s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes kzoom{
  0%{opacity:1;transform:scale(1.035);}
  100%{opacity:0;transform:scale(1);}
}
#snaretick{
  position:absolute;top:0;bottom:0;left:0;width:10px;
  background:#fff;opacity:0;pointer-events:none;
}
#snaretick.go{animation:stick .16s ease-out both;}
#snaretickR{
  position:absolute;top:0;bottom:0;right:0;width:10px;
  background:#fff;opacity:0;pointer-events:none;
}
#snaretickR.go{animation:stick .16s ease-out both;}
@keyframes stick{0%{opacity:.7;}100%{opacity:0;}}
/* ---- lyric layers ---- */
.lyr{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  visibility:hidden;z-index:2;
}
.lyr.on{visibility:visible;}
#word{
  font-family:var(--ff,Impact,sans-serif);color:var(--fg);text-align:center;
  padding:0 4vw;line-height:1.04;
  text-shadow:0 0 calc(var(--blur,0px)*var(--nrg)) var(--glow),0 0 calc(var(--blur,0px)*var(--nrg)*2.2) var(--glow);
  font-size:calc(var(--size,14vw)*(0.82 + var(--nrg)*0.36));
  letter-spacing:var(--ls,0);text-transform:var(--tt,none);
  max-width:100%;display:flex;flex-wrap:wrap;gap:.28em;justify-content:center;align-items:baseline;
}
/* ---- per-word enter/exit: each word is time-gated by its MEASURED
        start/end. .pre = before the vocal hits it, .live = vocal is on it,
        .done = vocal cut it. Enter on hit, exit on cut. ---- */
#word .w{
  display:inline-block;white-space:nowrap;opacity:0;
  transform:translateY(.35em) scale(.85);filter:blur(4px);
  text-shadow:0 0 calc(var(--blur,0px)*var(--wnrg,.5)) var(--glow);
}
#word .w.live{animation:win .18s cubic-bezier(.2,1.6,.4,1) both;}
#word .w.done{animation:wout .22s ease-in both;}
@keyframes win{
  from{opacity:0;transform:translateY(.35em) scale(.85);filter:blur(4px);}
  to{opacity:1;transform:none;filter:none;}
}
@keyframes wout{
  to{opacity:0;transform:translateY(-.25em) scale(.9);filter:blur(6px);}
}
/* kick-accent words slam when a kick onset lands within +-70ms of the word */
#word .w.slam{animation:wslam .25s cubic-bezier(.2,2,.4,1) both !important;}
@keyframes wslam{
  from{transform:scale(2.2) rotate(-4deg);opacity:0;}
  to{transform:none;opacity:1;}
}
[data-e="1"] #word{font-size:calc(var(--size)*1.25);}
/* ---- moods ---- */
#stage[data-m=intro]{--bg:#050505;--fg:#7d7d7d;--size:9vw;--ls:.28em;--ff:"Cormorant Garamond",Georgia,serif;}
#stage[data-m=chant]{--bg:#140f00;--fg:#ffc400;--glow:#ff9d00;--blur:26px;--size:14vw;--tt:uppercase;--ff:"Permanent Marker","Marker Felt",cursive;--ls:.02em;}
#stage[data-m=verse]{--bg:#0d0d0d;--fg:#e9e4d8;--size:12vw;--ls:-.02em;--ff:"Special Elite","Courier New",monospace;}
#stage[data-m=verse2]{--bg:#0c0709;--fg:#ff6b81;--size:12vw;--ls:-.01em;--tt:uppercase;--ff:"Black Ops One",Impact,sans-serif;}
#stage[data-m=verse3]{--bg:#070707;--fg:#c9bfa8;--glow:#6b0000;--blur:16px;--size:11vw;--ls:-.02em;--ff:"Special Elite","Courier New",monospace;}
#stage[data-m=pre]{--bg:#04080c;--fg:#a9d0ec;--glow:#5fa8d3;--blur:10px;--size:8vw;--ls:.14em;--ff:"Cormorant Garamond",Georgia,serif;}
#stage[data-m=hit]{--bg:#ececec;--fg:#0a0a0a;--size:22vw;--tt:uppercase;--ff:Anton,Impact,sans-serif;}
[data-m=hit] #word{-webkit-text-stroke:2px #000;}
#stage[data-m=end]{--bg:#000;--fg:#777;--size:7vw;--ls:.2em;--tt:uppercase;--ff:"Special Elite",monospace;}
#tag{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;
  text-align:center;font:600 11px/1 Arial,sans-serif;letter-spacing:.3em;
  text-transform:uppercase;color:var(--fg);opacity:.4;z-index:5;
}
#bar{position:absolute;bottom:0;left:0;height:3px;background:var(--fg);opacity:.6;width:0;z-index:5;}
#play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
  background:rgba(0,0,0,.72);border:0;color:#fff;font:700 18px Arial;cursor:pointer;
}
#play .pulse{
  width:96px;height:96px;border-radius:50%;background:#ff2a2a;
  display:flex;align-items:center;justify-content:center;font-size:36px;
  animation:pp 1.2s ease-in-out infinite;
}
@keyframes pp{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 #ff2a2a88;}
  50%{transform:scale(1.1);box-shadow:0 0 0 24px #ff2a2a00;}
}
#ctl{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:94%;z-index:5;
}
button{
  background:#ffffff14;color:var(--fg);border:1px solid #ffffff30;border-radius:20px;
  padding:12px 16px;font:600 14px Arial,sans-serif;min-height:48px;min-width:48px;
}
@media (prefers-reduced-motion:reduce){
  #word .w{animation:none !important;opacity:1;transform:none;filter:none;}
  #beatring,#beatring2,#kickflash,#kickzoom,#snaretick,#snaretickR{display:none;}
}
</style></head>

function pos(){var r=au.currentTime*1000;return isNaN(r)?0:r-delay;}
/* binary search: first index with arr[i] > p */
function upper(arr,p){
  var lo=0,hi=arr.length;
  while(lo<hi){var m=(lo+hi)>>1;if(arr[m]<=p){lo=m+1;}else{hi=m;}}
  return lo;
}

function show(i){
  var sh=SHOTS[i],L=layers[curL^1];
  S.dataset.m=sh.m;S.dataset.e=sh.x;
  S.style.setProperty("--nrg",sh.nrg.toFixed(3));
  G.textContent=NAMES[sh.m]||sh.m;
  var wb=L.querySelector("#word");
  wb.innerHTML=sh.t;
  wb.style.fontSize="";
  var avail=S.clientWidth*0.92,widest=0;
  var spans=wb.querySelectorAll(".w");
  for(var k=0;k<spans.length;k++){
    var s=spans[k];
    widest=Math.max(widest,s.offsetWidth);
    s.dataset.st="pre";
    s.classList.remove("live","done","slam");
  }
  if(widest>avail){
    wb.style.fontSize=(parseFloat(getComputedStyle(wb).fontSize)*avail/widest)+"px";
  }
  layers[curL].classList.remove("on");
  L.classList.add("on");
  curL^=1;cur=i;
}
function hideAll(){
  layers[0].classList.remove("on");
  layers[1].classList.remove("on");
  cur=-1;
}
/* per-word state machine: enter when the vocal HITS the word,

function wordStates(p){
  var L=layers[curL]; /* show() already flipped curL: layers[curL] is visible */
  if(!L.classList.contains("on")){return;}
  var spans=L.querySelectorAll(".w");
  for(var k=0;k<spans.length;k++){
    var s=spans[k];
    var ws=parseFloat(s.dataset.s),we=parseFloat(s.dataset.e);
    var st=p<ws?"pre":(p<we?"live":"done");
    if(s.dataset.st!==st){
      s.dataset.st=st;
      if(st==="live"){s.classList.add("live");s.classList.remove("done");}
      else if(st==="done"){s.classList.add("done");s.classList.remove("live");}
      else{s.classList.remove("live","done");}
    }
  }
}
function upd(){
  var p=pos();
  /* ---- beat-reactive events: fire on EVERY frame, even between shots ---- */
  while(bi<BEATS.length&&BEATS[bi]<=p){fire(RING);fire(RING2);bi++;}
  while(ki<KICKS.length&&KICKS[ki]<=p){
    fire(KFL);fire(KZM);
    var KL=layers[curL]; /* visible layer (see wordStates note) */
    if(KL.classList.contains("on")){
      var kw=KL.querySelector('.w[data-k="1"]:not(.done)');
      if(kw){kw.classList.remove("slam");void kw.offsetWidth;kw.classList.add("slam");}
    }
    ki++;
  }
  while(si<SNARES.length&&SNARES[si]<=p){fire(STK);fire(STKR);si++;}
  var i=-1;
  for(var q=0;q<SHOTS.length;q++){
    if(p>=SHOTS[q].s&&p<SHOTS[q].e){i=q;break;}
  }
  if(i<0){
    if(p<SHOTS[0].s){if(cur!==-2){hideAll();cur=-2;}}
    else if(cur>=0){
      var sh=SHOTS[cur];
      if(p>sh.e+900){hideAll();}
    }
    B.style.width=Math.max(0,Math.min(100,p/END*100))+"%";
    return;
  }
  if(i!==cur){show(i);}
  wordStates(p);
  B.style.width=Math.max(0,Math.min(100,p/END*100))+"%";
}
function resetPtrs(p){bi=upper(BEATS,p);ki=upper(KICKS,p);si=upper(SNARES,p);}
function play(){
  playBtn.style.display="none";
  playing=true;
  resetPtrs(pos());
  var pr=au.play();
  if(pr&&pr.catch){
    pr.catch(function(err){G.textContent="Tap again to play";playBtn.style.display="flex";playing=false;});
  }
  if(navigator.wakeLock){
    navigator.wakeLock.request("screen").then(
      function(wl){wakeLock=wl;},
      function(e){}
    );
  }
  $("b2").innerHTML="&#10074;&#10074;";
  tick();
}
function pause(){
  au.pause();playing=false;
  $("b2").innerHTML="&#9654;";
  if(wakeLock){wakeLock.release();wakeLock=null;}
}
function tick(){if(!playing){return;}upd();requestAnimationFrame(tick);}
playBtn.onclick=play;
$("b2").onclick=function(e){
  e.stopPropagation();
  if(playing){pause();}
  else if(au.currentTime>0&&!au.paused){pause();}
  else{play();}
};
$("dn").onclick=function(e){e.stopPropagation();delay-=50;cur=-1;resetPtrs(pos());};
$("up").onclick=function(e){e.stopPropagation();delay+=50;cur=-1;resetPtrs(pos());};
S.onclick=function(e){
  if(e.target.closest("#ctl")||e.target.closest("#play")){return;}
  if(playing){pause();}else{play();}
};
addEventListener("keydown",function(e){
  if(e.code==="Space"){e.preventDefault();if(playing){pause();}else{play();}}
});
